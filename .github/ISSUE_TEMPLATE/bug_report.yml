name: Сообщить об ошибке
description: Сообщите о сбое, неверном результате или проблеме интерфейса OgibArm
title: "[Ошибка] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Спасибо, что помогаете улучшать OgibArm. Не публикуйте личные, рабочие или конфиденциальные данные.
  - type: input
    id: version
    attributes:
      label: Версия OgibArm
      placeholder: Например, v1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Например, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: dxf_type
    attributes:
      label: Тип DXF
      options:
        - R12
        - R2007
        - Оба типа
        - Не относится к обработке DXF
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить проблему
      description: Опишите последовательность действий и выбранные параметры.
      placeholder: |
        1. Добавил…
        2. Выбрал…
        3. Появилось…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Журнал и дополнительные материалы
      description: При необходимости приложите журнал или снимок экрана. Не публикуйте конфиденциальные DXF.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед отправкой
      options:
        - label: Я убедился, что в обращении и вложениях нет личных, рабочих или конфиденциальных данных.
          required: true
